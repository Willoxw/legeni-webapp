---
docker_apt_keyring: /etc/apt/keyrings/docker.asc
docker_apt_repository: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_prerequisite_packages:
  - ca-certificates
  - curl
  - gnupg
  - python3-debian
  - python3-docker
docker_users:
  - "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"
