---
- name: Installer les prérequis Docker
  ansible.builtin.apt:
    name: "{{ docker_prerequisite_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Créer le répertoire des clés APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Télécharger la clé GPG du dépôt Docker
  ansible.builtin.get_url:
    url: "{{ docker_apt_repository }}/gpg"
    dest: "{{ docker_apt_keyring }}"
    mode: "0644"

- name: Ajouter le dépôt APT Docker
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: ["{{ docker_apt_repository }}"]
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    architectures:
      - "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"
    signed_by: "{{ docker_apt_keyring }}"
    state: present

- name: Installer Docker Engine et CLI
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Démarrer et activer le service Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Ajouter l'utilisateur au groupe docker
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
