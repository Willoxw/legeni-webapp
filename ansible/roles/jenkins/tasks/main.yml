---
- name: Construire l'image Jenkins personnalisée
  community.docker.docker_image:
    name: "{{ jenkins_image }}"
    tag: "{{ jenkins_image_tag }}"
    source: build
    build:
      path: "{{ role_path }}/files"
      dockerfile: Dockerfile

- name: Créer le volume persistant Jenkins
  community.docker.docker_volume:
    name: "{{ jenkins_home_volume }}"
    state: present

- name: Inspecter le socket Docker
  ansible.builtin.stat:
    path: "{{ jenkins_docker_socket }}"
  register: jenkins_docker_socket_stat

- name: Vérifier que le socket Docker existe
  ansible.builtin.assert:
    that:
      - jenkins_docker_socket_stat.stat.exists
    fail_msg: "Le socket Docker {{ jenkins_docker_socket }} est absent."

- name: Démarrer le conteneur Jenkins
  community.docker.docker_container:
    name: "{{ jenkins_container_name }}"
    image: "{{ jenkins_image }}:{{ jenkins_image_tag }}"
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "{{ jenkins_http_port }}:8080"
      - "{{ jenkins_agent_port }}:50000"
    volumes:
      - "{{ jenkins_home_volume }}:/var/jenkins_home"
      - "{{ jenkins_docker_socket }}:/var/run/docker.sock"
    groups:
      - "{{ jenkins_docker_socket_stat.stat.gid | string }}"
    env:
      CASC_JENKINS_CONFIG: /usr/share/jenkins/ref/casc.yaml
      JENKINS_ADMIN_USER: "{{ jenkins_admin_user }}"
      JENKINS_ADMIN_PASSWORD: "{{ vault_jenkins_admin_password }}"
  no_log: true
