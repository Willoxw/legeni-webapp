---
- name: Lire la version stable de kubectl
  ansible.builtin.uri:
    url: "{{ kubectl_stable_version_url }}"
    return_content: true
  register: kubectl_stable_version
  changed_when: false
  become: false

- name: Installer kubectl
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_stable_version.content | trim }}/bin/linux/{{ minikube_architecture }}/kubectl"
    dest: /usr/local/bin/kubectl
    mode: "0755"
  become: true

- name: Installer minikube
  ansible.builtin.get_url:
    url: "{{ minikube_binary_url }}"
    dest: /usr/local/bin/minikube
    mode: "0755"
  become: true

- name: Vérifier l'état du profil Minikube
  ansible.builtin.command:
    argv:
      - minikube
      - status
      - --profile
      - "{{ minikube_profile }}"
  register: minikube_status
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ minikube_user }}"

- name: Démarrer Minikube avec le driver Docker
  ansible.builtin.command:
    argv:
      - minikube
      - start
      - --driver=docker
      - --cpus=2
      - --memory=3072mb
      - --profile
      - "{{ minikube_profile }}"
  when: "'apiserver: Running' not in minikube_status.stdout"
  become: true
  become_user: "{{ minikube_user }}"

- name: Actualiser le contexte kubectl si nécessaire
  ansible.builtin.command:
    argv:
      - minikube
      - update-context
      - --profile
      - "{{ minikube_profile }}"
  when: "'kubeconfig: Configured' not in minikube_status.stdout"
  changed_when: false
  become: true
  become_user: "{{ minikube_user }}"

- name: Activer les addons Minikube requis
  ansible.builtin.command:
    argv:
      - minikube
      - addons
      - enable
      - "{{ item }}"
      - --profile
      - "{{ minikube_profile }}"
  loop: "{{ minikube_addons }}"
  changed_when: false
  become: true
  become_user: "{{ minikube_user }}"

- name: Inspecter les conteneurs du réseau Docker Minikube
  ansible.builtin.command:
    argv:
      - docker
      - network
      - inspect
      - "{{ minikube_docker_network }}"
  register: minikube_docker_network_info
  changed_when: false
  become: true

- name: Connecter Jenkins au réseau Docker Minikube
  ansible.builtin.command:
    argv:
      - docker
      - network
      - connect
      - "{{ minikube_docker_network }}"
      - "{{ minikube_jenkins_container }}"
  when: >-
    minikube_jenkins_container not in
    ((minikube_docker_network_info.stdout | from_json)[0].Containers
    | default({}, true) | dict2items | map(attribute='value.Name') | list)
  become: true
